AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FloodShield serverless API
Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 8
    MemorySize: 256
    Tracing: Active
Resources:
  FloodShieldApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: ['GET', 'POST', 'OPTIONS']
        AllowHeaders: ['content-type']
  FloodShieldTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: PK, AttributeType: S}, {AttributeName: SK, AttributeType: S}]
      KeySchema: [{AttributeName: PK, KeyType: HASH}, {AttributeName: SK, KeyType: RANGE}]
      TimeToLiveSpecification: {AttributeName: expiresAt, Enabled: true}
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: src/handler.handler
      Environment: { Variables: { TABLE_NAME: !Ref FloodShieldTable } }
      Policies: [{ DynamoDBCrudPolicy: { TableName: !Ref FloodShieldTable } }]
      Events:
        AnyRequest:
          Type: HttpApi
          Properties: { ApiId: !Ref FloodShieldApi, Path: '/{proxy+}', Method: ANY }
Outputs:
  ApiUrl: { Value: !Sub 'https://${FloodShieldApi}.execute-api.${AWS::Region}.amazonaws.com', Description: FloodShield API URL }
